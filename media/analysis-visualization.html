<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码分析可视化</title>
    <link rel="stylesheet" href="{{cssUri}}">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            overflow-x: hidden;
        }

        .analysis-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 顶部工具栏 */
        .analysis-toolbar {
            height: 48px;
            background: var(--vscode-editorGroupHeader-tabsBackground);
            border-bottom: 1px solid var(--vscode-editorGroupHeader-tabsBorder);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .toolbar-button {
            padding: 6px 12px;
            background: var(--vscode-button-secondaryBackground);
            border: 1px solid var(--vscode-button-secondaryBorder);
            border-radius: 3px;
            color: var(--vscode-button-secondaryForeground);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .toolbar-button:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        .toolbar-button.active {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        /* 主内容区域 */
        .analysis-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧分析树 */
        .analysis-tree {
            width: 300px;
            background: var(--vscode-sideBar-background);
            border-right: 1px solid var(--vscode-sideBar-border);
            overflow-y: auto;
        }

        .tree-section {
            border-bottom: 1px solid var(--vscode-sideBar-border);
        }

        .tree-header {
            padding: 12px 16px;
            background: var(--vscode-sideBarSectionHeader-background);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-header:hover {
            background: var(--vscode-list-hoverBackground);
        }

        .tree-content {
            max-height: 300px;
            overflow-y: auto;
        }

        .tree-item {
            padding: 8px 16px 8px 32px;
            cursor: pointer;
            font-size: 13px;
            border-left: 3px solid transparent;
        }

        .tree-item:hover {
            background: var(--vscode-list-hoverBackground);
        }

        .tree-item.selected {
            background: var(--vscode-list-activeSelectionBackground);
            border-left-color: var(--vscode-focusBorder);
            color: var(--vscode-list-activeSelectionForeground);
        }

        .tree-item-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 3px;
            text-align: center;
            line-height: 16px;
            font-size: 10px;
            color: white;
        }

        .component-icon { background: #61dafb; }
        .hook-icon { background: #f39c12; }
        .function-icon { background: #3498db; }
        .struct-icon { background: #ce422b; }
        .enum-icon { background: #e67e22; }
        .trait-icon { background: #27ae60; }

        /* 右侧可视化区域 */
        .visualization-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 标签页 */
        .tab-container {
            display: flex;
            background: var(--vscode-editorGroupHeader-tabsBackground);
            border-bottom: 1px solid var(--vscode-editorGroupHeader-tabsBorder);
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab:hover {
            background: var(--vscode-tab-hoverBackground);
        }

        .tab.active {
            background: var(--vscode-tab-activeBackground);
            border-bottom-color: var(--vscode-focusBorder);
            color: var(--vscode-tab-activeForeground);
        }

        /* 可视化内容 */
        .visualization-content {
            flex: 1;
            position: relative;
            overflow: auto;
            padding: 20px;
        }

        .tab-panel {
            display: none;
            height: 100%;
        }

        .tab-panel.active {
            display: block;
        }

        /* 架构图 */
        .architecture-diagram {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #architecture-canvas {
            width: 100%;
            height: 400px;
            border: 1px solid var(--vscode-textBlockQuote-border);
            border-radius: 4px;
            background: var(--vscode-editor-background);
        }

        /* 性能图表 */
        .performance-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 100%;
        }

        .chart-container {
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-textBlockQuote-border);
            border-radius: 4px;
            padding: 16px;
        }

        .chart-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--vscode-textPreformat-foreground);
        }

        .chart-content {
            height: 200px;
            position: relative;
        }

        /* 指标卡片 */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-textBlockQuote-border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-trend {
            font-size: 11px;
            margin-top: 4px;
        }

        .trend-up { color: #28a745; }
        .trend-down { color: #dc3545; }
        .trend-stable { color: #6c757d; }

        /* 问题列表 */
        .issues-list {
            max-height: 100%;
            overflow-y: auto;
        }

        .issue-item {
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-textBlockQuote-border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .issue-item:hover {
            border-color: var(--vscode-focusBorder);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .issue-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .issue-severity {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-error {
            background: #dc3545;
            color: white;
        }

        .severity-warning {
            background: #ffc107;
            color: #000;
        }

        .severity-info {
            background: #17a2b8;
            color: white;
        }

        .issue-title {
            font-weight: 600;
            flex: 1;
        }

        .issue-description {
            color: var(--vscode-descriptionForeground);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .issue-location {
            font-size: 12px;
            color: var(--vscode-textLink-foreground);
            font-family: monospace;
        }

        /* 依赖图 */
        .dependency-graph {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #dependency-canvas {
            width: 100%;
            height: 500px;
            border: 1px solid var(--vscode-textBlockQuote-border);
            border-radius: 4px;
            background: var(--vscode-editor-background);
        }

        /* 加载状态 */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--vscode-descriptionForeground);
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--vscode-progressBar-background);
            border-top: 3px solid var(--vscode-progressBar-foreground);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--vscode-descriptionForeground);
            text-align: center;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-description {
            font-size: 14px;
            max-width: 300px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="analysis-container">
        <!-- 工具栏 -->
        <div class="analysis-toolbar">
            <button class="toolbar-button active" id="btn-refresh" title="刷新分析">
                🔄 刷新分析
            </button>
            <button class="toolbar-button" id="btn-export" title="导出报告">
                📄 导出报告
            </button>
            <button class="toolbar-button" id="btn-settings" title="分析设置">
                ⚙️ 设置
            </button>
            <div style="flex: 1;"></div>
            <span id="analysis-status" style="font-size: 12px; color: var(--vscode-descriptionForeground);">
                分析完成
            </span>
        </div>

        <!-- 主内容区域 -->
        <div class="analysis-content">
            <!-- 左侧分析树 -->
            <div class="analysis-tree">
                <div class="tree-section">
                    <div class="tree-header" data-section="components">
                        📦 组件 (<span id="component-count">0</span>)
                    </div>
                    <div class="tree-content" id="components-tree"></div>
                </div>

                <div class="tree-section">
                    <div class="tree-header" data-section="hooks">
                        🎣 Hooks (<span id="hook-count">0</span>)
                    </div>
                    <div class="tree-content" id="hooks-tree"></div>
                </div>

                <div class="tree-section">
                    <div class="tree-header" data-section="functions">
                        ⚡ 函数 (<span id="function-count">0</span>)
                    </div>
                    <div class="tree-content" id="functions-tree"></div>
                </div>

                <div class="tree-section">
                    <div class="tree-header" data-section="structs">
                        🏗 结构体 (<span id="struct-count">0</span>)
                    </div>
                    <div class="tree-content" id="structs-tree"></div>
                </div>

                <div class="tree-section">
                    <div class="tree-header" data-section="traits">
                        🎯 特征 (<span id="trait-count">0</span>)
                    </div>
                    <div class="tree-content" id="traits-tree"></div>
                </div>
            </div>

            <!-- 右侧可视化面板 -->
            <div class="visualization-panel">
                <!-- 标签页 -->
                <div class="tab-container">
                    <div class="tab active" data-tab="overview">📊 概览</div>
                    <div class="tab" data-tab="architecture">🏗 架构</div>
                    <div class="tab" data-tab="performance">⚡ 性能</div>
                    <div class="tab" data-tab="issues">⚠️ 问题</div>
                    <div class="tab" data-tab="dependencies">🔗 依赖</div>
                </div>

                <!-- 可视化内容 -->
                <div class="visualization-content">
                    <!-- 概览面板 -->
                    <div class="tab-panel active" id="overview-panel">
                        <div class="metrics-grid">
                            <div class="metric-card">
                                <div class="metric-value" id="total-lines">0</div>
                                <div class="metric-label">代码行数</div>
                                <div class="metric-trend trend-up" id="lines-trend">+12%</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="complexity-score">0</div>
                                <div class="metric-label">复杂度评分</div>
                                <div class="metric-trend trend-stable" id="complexity-trend">稳定</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="test-coverage">0%</div>
                                <div class="metric-label">测试覆盖率</div>
                                <div class="metric-trend trend-down" id="coverage-trend">-5%</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="performance-score">0</div>
                                <div class="metric-label">性能评分</div>
                                <div class="metric-trend trend-up" id="performance-trend">+8%</div>
                            </div>
                        </div>

                        <div class="chart-container">
                            <div class="chart-title">代码质量趋势</div>
                            <div class="chart-content" id="quality-chart">
                                <canvas id="quality-trend-canvas" width="400" height="200"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- 架构面板 -->
                    <div class="tab-panel" id="architecture-panel">
                        <div class="architecture-diagram">
                            <canvas id="architecture-canvas"></canvas>
                        </div>
                    </div>

                    <!-- 性能面板 -->
                    <div class="tab-panel" id="performance-panel">
                        <div class="performance-charts">
                            <div class="chart-container">
                                <div class="chart-title">渲染性能</div>
                                <div class="chart-content">
                                    <canvas id="render-performance-canvas" width="300" height="200"></canvas>
                                </div>
                            </div>
                            <div class="chart-container">
                                <div class="chart-title">内存使用</div>
                                <div class="chart-content">
                                    <canvas id="memory-usage-canvas" width="300" height="200"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 问题面板 -->
                    <div class="tab-panel" id="issues-panel">
                        <div class="issues-list" id="issues-list">
                            <!-- 动态加载问题列表 -->
                        </div>
                    </div>

                    <!-- 依赖面板 -->
                    <div class="tab-panel" id="dependencies-panel">
                        <div class="dependency-graph">
                            <canvas id="dependency-canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{scriptUri}}"></script>
</body>
</html>
